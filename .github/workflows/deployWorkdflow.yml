name: Deploy to Virtual Server

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  run_tests:
    name: Run Discord Bot Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest aioresponses pytest-asyncio

      - name: Run tests
        run: python -m pytest Test/test_main.py

  remove_container:
    name: Remove Old Discord Bot Container
    runs-on: ubuntu-latest
    needs: run_tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Remove old container
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER_NAME }}
          key: ${{ secrets.DISCORD_SECRET }}
          port: 22
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            echo "Stopping and removing existing Discord bot container..."
            docker stop discord-bot || true
            docker rm discord-bot || true

            echo "Removing old Docker image..."
            docker rmi my-discord-bot:latest || true

  build_image:
    name: Build Discord Bot Image
    runs-on: ubuntu-latest
    needs: remove_container
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Build and run new Docker image
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER_NAME }}
          key: ${{ secrets.DISCORD_SECRET }}
          port: 22
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            set -e

            cd /root/Discord_BOT
            git pull --ff-only
            docker build -t my-discord-bot:latest .
            docker run \
              --restart=unless-stopped \
              -d \
              --name discord-bot \
              my-discord-bot:latest

  check_logs:
    name: Check Discord Bot Logs
    runs-on: ubuntu-latest
    needs: build_image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Check Docker logs
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER_NAME }}
          key: ${{ secrets.DISCORD_SECRET }}
          port: 22
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            docker ps --filter name=discord-bot
            docker logs --tail 100 discord-bot
